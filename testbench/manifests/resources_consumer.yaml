apiVersion: v1
kind: Pod
metadata:
  name: pc1
  namespace: consumer-local
  labels:
    app: pc1
spec:
  containers:
    - name: tester
      image: riccardotornesello/hello-world-http-server:v2.1.0-tester
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          name: web
  nodeSelector:
    tier: worker-1

---
apiVersion: v1
kind: Pod
metadata:
  name: pc2
  namespace: consumer-local
  labels:
    app: pc2
spec:
  containers:
    - name: tester
      image: riccardotornesello/hello-world-http-server:v2.1.0-tester
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          name: web
  nodeSelector:
    tier: worker-2

---
apiVersion: v1
kind: Service
metadata:
  name: sc1
  namespace: consumer-local
spec:
  ports:
    - name: web
      port: 80
      protocol: TCP
      targetPort: web
  selector:
    app: pc1
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: sc2
  namespace: consumer-local
spec:
  ports:
    - name: web
      port: 80
      protocol: TCP
      targetPort: web
  selector:
    app: pc2
  type: ClusterIP
