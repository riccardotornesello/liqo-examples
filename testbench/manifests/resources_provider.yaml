apiVersion: v1
kind: Pod
metadata:
  name: pp1
  namespace: provider-local
  labels:
    app: pp1
spec:
  containers:
    - name: tester
      image: riccardotornesello/hello-world-http-server:v2.0.0-tester
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          name: web
  nodeSelector:
    tier: worker-1

---
apiVersion: v1
kind: Pod
metadata:
  name: pp2
  namespace: provider-local
  labels:
    app: pp2
spec:
  containers:
    - name: tester
      image: riccardotornesello/hello-world-http-server:v2.0.0-tester
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          name: web
  nodeSelector:
    tier: worker-2

---
apiVersion: v1
kind: Service
metadata:
  name: sp1
  namespace: provider-local
spec:
  ports:
    - name: web
      port: 80
      protocol: TCP
      targetPort: web
  selector:
    app: pp1
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: sp2
  namespace: provider-local
spec:
  ports:
    - name: web
      port: 80
      protocol: TCP
      targetPort: web
  selector:
    app: pp2
  type: ClusterIP
