clusters:
  - name: rome
    color: "43"
    kubeconfig_location: ../testbench/liqo_kubeconf_rome
    namespaces:
      - name: consumer-local
      - name: offloaded
  - name: milan
    color: "44"
    kubeconfig_location: ../testbench/liqo_kubeconf_milan
    namespaces:
      - name: offloaded-rome
      - name: provider-local

tests:
  - name: Default
  - name: Filter gateway output
    resources:
      - type: tunnel_firewall_rule
        cluster: milan
        name: gw-rome
        namespace: liqo-tenant-rome
        options:
          allow_to_offloaded_pods_from: rome
          allow_established: false
      - type: isolation_network_policy
        cluster: milan
        name: isolate-offloaded-rome
        namespace: offloaded-rome
        options:
          allowed_clusters:
            - rome
